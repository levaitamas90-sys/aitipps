            .sidebar { width: 320px; border-right: 1px solid #1e293b; padding: 20px; overflow-y: auto; background: #020617; flex-shrink: 0; } 

             

            .brand-header {

                margin-bottom: 30px; letter-spacing: 1.5px; border-bottom: 1px solid #1e293b; padding-bottom: 20px; 

            } 

  

            .league-header {

                background: #0f172a; border: 1px solid #1e293b; color: white;

            .league-header.active { border-color: #38bdf8; background: #1e293b; } 

             

            .match-container { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: rgba(15, 23, 42, 0.4); border-radius: 0 0 10px 10px; } 

            .match-item { padding: 12px 15px; font-size: 0.8rem; cursor: pointer; color: #94a3b8; border-bottom: 1px solid #1e293b; transition: 0.2s; } 

            .match-item:hover { color: #38bdf8; background: rgba(56, 189, 248, 0.05); } 

  

            /* FŐ TARTALOM */ 

            .main-content { flex: 1; display: flex; flex-direction: column; background: #0b0f1a; overflow-y: auto; padding: 30px; align-items: center; } 

             

            .analysis-header { text-align: center; margin-bottom: 30px; width: 100%; } 

            .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; max-width: 900px; margin-bottom: 25px; } 

            .stat-box { background: #0f172a; padding: 18px; border-radius: 15px; text-align: center; border: 1px solid #1e293b; } 

            .stat-label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; } 

            .stat-val { font-family: 'Orbitron'; font-size: 1.4rem; display: block; color: #38bdf8; margin-top: 8px; } 

  

            .info-panel { background: #0f172a; padding: 25px; border-radius: 20px; width: 100%; max-width: 900px; border: 1px solid #1e293b; box-sizing: border-box; } 

            .pill-container { display: flex; gap: 15px; justify-content: center; margin: 15px 0; } 

            .pill { background: #020617; border: 1px solid #38bdf8; padding: 10px 22px; border-radius: 10px; font-family: 'Orbitron'; color: #fbbf24; font-size: 1.2rem; } 

             

            /* SZIMULÁCIÓS TERÜLET */ 

            .sim-area { width: 450px; margin-top: 35px; background: #0f172a; padding: 25px; border-radius: 25px; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0,0,0,0.6); } 

            .pitch { width: 100%; height: 170px; background: #15803d; border-radius: 12px; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); } 

            .pitch::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.2); } 

            .sb { display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 2.8rem; margin-bottom: 15px; padding: 0 30px; } 

            .timer-box { font-size: 1rem; color: #fbbf24; align-self: center; background: #020617; padding: 5px 12px; border-radius: 6px; border: 1px solid #1e293b; } 

             

            .goal-effect { animation: goal-pulse 0.6s; } 

            @keyframes goal-pulse { 0% { color: white; } 50% { color: #fbbf24; transform: scale(1.3); } 100% { color: inherit; } } 

  

            .btn-start {  

                width: 100%; background: #38bdf8; border: none; padding: 16px; border-radius: 12px;  

                font-weight: bold; cursor: pointer; font-family: 'Orbitron'; font-size: 0.9rem;  

                margin-top: 20px; transition: 0.3s; color: #020617; 

            } 

            .btn-start:hover { background: #fbbf24; transform: translateY(-3px); }

                document.getElementById('valO25').innerText = total > 2.5 ? "IGEN" : "NEM"; 

                document.getElementById('valBtts').innerText = total > 2.2 ? "IGEN" : "NEM"; 

  

                const pills = document.getElementById('scorePills'); 

                pills.innerHTML = ''; 

                ['1-0', '1-1', '2-1'].forEach(s => { 

                    let p = document.createElement('div'); p.className = 'pill'; p.innerText = s; pills.appendChild(p); 

                }); 

  

                currentMatchData = {xH, xV}; 

                clearSim(); 

            } 

  

            function clearSim() { 

                clearInterval(simClock); 

                document.getElementById('scoreH').innerText = '0'; 

                document.getElementById('scoreV').innerText = '0'; 

                document.getElementById('matchMin').innerText = "00'"; 

                document.getElementById('pitchLayout').innerHTML = ''; 

                document.getElementById('triggerSim').disabled = false; 

            } 

  

            function runSimulation() { 

                clearSim(); 

                document.getElementById('triggerSim').disabled = true; 

                let m = 0, sH = 0, sV = 0; 

                 

                simClock = setInterval(() => { 

                    m++; 

                    document.getElementById('matchMin').innerText = m.toString().padStart(2, '0') + "'"; 

                     

                    if(Math.random() < currentMatchData.xH/90) { 

                        sH++; 

                        flashScore('scoreH', sH); 

                        addBall('15%'); 

                    } 

                    if(Math.random() < currentMatchData.xV/90) { 

                        sV++; 

                        flashScore('scoreV', sV); 

                        addBall('65%'); 

                    } 

  

                    if(m >= 90) { 

                        clearInterval(simClock); 

                        document.getElementById('triggerSim').disabled = false; 

                        document.getElementById('matchMin').innerText = "VÉGE"; 

                    } 

                }, 100); 

            } 

  

            function flashScore(id, val) { 

                const el = document.getElementById(id); 

                el.innerText = val; 

                el.classList.add('goal-effect'); 

                setTimeout(() => el.classList.remove('goal-effect'), 600); 

            } 

  

            function addBall(l) { 

                const b = document.createElement('div'); 

                b.style.position = 'absolute'; 

                b.style.fontSize = '24px'; 

                b.innerText = '⚽'; 

                b.style.left = (parseFloat(l) + Math.random()*25) + '%'; 

                b.style.top = Math.random()*65 + 10 + '%'; 

                document.getElementById('pitchLayout').appendChild(b); 

            } 

        </script> 

    </body> 

    </html>

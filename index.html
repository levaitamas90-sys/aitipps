
    <!DOCTYPE html>
    <html lang="hu">
    <head>
        <meta charset="UTF-8">
        <title>GamblingAddicts AI - Dashboard</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
            
            body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
            .compact-container { width: 100%; max-width: 850px; }
            
            .header-mini { text-align: left; margin-bottom: 25px; border-left: 4px solid #38bdf8; padding-left: 15px; }
            .header-mini h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; }
            .header-mini p { margin: 0; font-size: 0.8rem; color: #64748b; }

            table { width: 100%; border-collapse: collapse; background: #0f172a; border-radius: 12px; overflow: hidden; font-size: 0.85rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
            th { background: #1e293b; padding: 12px; text-align: center; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
            td { padding: 12px; border-bottom: 1px solid #1e293b; text-align: center; }
            
            .match-info { text-align: left; min-width: 200px; }
            .league-label { font-size: 0.65rem; color: #38bdf8; font-weight: bold; display: block; }
            .date-label { font-size: 0.65rem; color: #64748b; }

            /* ESÉLYEK */
            .prob-row { display: flex; justify-content: center; gap: 4px; }
            .p-val { background: #1e293b; padding: 3px 6px; border-radius: 4px; min-width: 32px; font-size: 0.75rem; color: #cbd5e1; border: 1px solid #334155; }
            
            /* GÓLÁTLAG KIEMELÉS */
            .goal-pred { background: #fbbf24; color: #000; font-weight: 800; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; }
            
            .ou-box { font-weight: 600; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; border: 1px solid #38bdf8; color: #38bdf8; }
            .btts-text { color: #10b981; font-weight: 700; }

            tr:hover { background: #161e2e; cursor: pointer; }
            
            /* MODAL / SIMULATOR */
            .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
            .modal-content { background: #0f172a; margin: 10% auto; padding: 25px; border-radius: 15px; width: 400px; border: 1px solid #38bdf8; text-align: center; }
            .pitch-mini { width: 100%; height: 140px; background: #15803d; border-radius: 8px; position: relative; margin: 15px 0; overflow: hidden; }
        </style>
    </head>
    <body>

    <div class="compact-container">
        <div class="header-mini">
            <h1>GamblingAddicts AI</h1>
            <p>Várható gólátlag alapú fogadási segédlet</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mérkőzés</th>
                    <th>1 X 2 Esély</th>
                    <th>Várható Gól</th>
                    <th>Tipp (2.5)</th>
                    <th>BTTS</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

    <div id="simModal" class="modal">
        <div class="modal-content">
            <h3 id="simT" style="margin-top:0; font-size: 1rem;"></h3>
            <div style="font-size: 2rem; font-weight: 700; margin: 10px 0;"><span id="s1">0</span> - <span id="s2">0</span></div>
            <div id="pitch" class="pitch-mini"></div>
            <div style="display:flex; gap:10px;">
                <button onclick="closeSim()" style="flex:1; padding:10px; background:#334155; color:white; border:none; border-radius:6px; cursor:pointer;">Bezárás</button>
                <button onclick="startSim()" style="flex:2; padding:10px; background:#38bdf8; color:black; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">90' Szimuláció</button>
            </div>
        </div>
    </div>

    <script>
        let current = null;
        let timer;
        function openSim(h, v, xh, xv) {
            document.getElementById('simModal').style.display = 'block';
            document.getElementById('simT').innerText = h + " - " + v;
            current = {xh, xv};
            document.getElementById('s1').innerText = 0; document.getElementById('s2').innerText = 0;
            document.getElementById('pitch').innerHTML = "";
        }
        function closeSim() { document.getElementById('simModal').style.display = 'none'; clearInterval(timer); }
        function startSim() {
            let m = 0, hG = 0, vG = 0;
            clearInterval(timer);
            timer = setInterval(() => {
                m++;
                if(Math.random() < current.xh/90) { hG++; document.getElementById('s1').innerText = hG; }
                if(Math.random() < current.xv/90) { vG++; document.getElementById('s2').innerText = vG; }
                if(m>=90) clearInterval(timer);
            }, 40);
        }
    </script>

    </body>
    </html>

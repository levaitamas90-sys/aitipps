            // Navigáció feltöltése 

            const nav = document.getElementById('leagueNav'); 

            for (let id in data) { 

                const card = document.createElement('div'); 

                card.className = 'league-card'; 

                card.onclick = () => showMatches(id, card); 

                card.innerHTML = `<span>${data[id].info.flag}</span><b>${data[id].info.name}</b>`; 

                nav.appendChild(card); 

            } 

  

            function showMatches(lid, el) { 

                document.querySelectorAll('.league-card').forEach(c => c.classList.remove('active')); 

                el.classList.add('active'); 

                 

                const list = document.getElementById('matchList'); 

                list.innerHTML = ''; 

                data[lid].matches.forEach((m, idx) => { 

                    const div = document.createElement('div'); 

                    div.className = 'match-item'; 

                    div.style.display = 'flex'; 

                    div.onclick = () => showAnalysis(lid, idx); 

                    div.innerHTML = `<div><span class="match-date">${m.date}</span><br><b>${m.home} - ${m.away}</b></div><div style="color:#38bdf8">➔</div>`; 

                    list.appendChild(div); 

                }); 

            } 

  

            function showAnalysis(lid, idx) { 

                const m = data[lid].matches[idx]; 

                const d = m.data; 

                const modalBody = document.getElementById('modalBody'); 

                 

                modalBody.innerHTML = ` 

                    <div class="modal-header"> 

                        <div style="font-size:0.8em; color:#38bdf8">${m.date}</div> 

                        <div style="font-size:1.4em; font-weight:600">${m.home} - ${m.away}</div> 

                        <div class="modal-xg">${d.xg} <span style="font-size:0.4em">VÁRHATÓ GÓL</span></div> 

                        <p style="font-size:0.85em; font-style:italic; color:#94a3b8">"${d.narrative}"</p> 

                    </div> 

                     

                    <div class="stat-grid"> 

                        <div class="stat-box"><span class="stat-label">H - D - V esély</span><span class="stat-val">${d.win}% - ${d.draw}% - ${d.loss}%</span></div> 

                        <div class="stat-box"><span class="stat-label">2.5 Gól felett</span><span class="stat-val" style="color:#f472b6">${d.o25}%</span></div> 

                        <div class="stat-box"><span class="stat-label">BTTS (Mindkét gól)</span><span class="stat-val" style="color:#4ade80">${d.btts}%</span></div> 

                        <div class="stat-box"><span class="stat-label">AI Kockázati index</span><span class="stat-val" style="color:#fbbf24">${d.risk}/10</span></div> 

                    </div> 

  

                    <div style="margin-top:20px; text-align:center; font-size:0.7em; color:#64748b; text-transform:uppercase;">Top 3 Leggyakoribb AI eredmény:</div> 

                    <div class="score-list"> 

                        ${d.top3.map(s => `<div class="score-tag"><b>${s.score}</b>${s.p}</div>`).join('')} 

                    </div> 

                `; 

                document.getElementById('modal').style.display = 'flex'; 

            } 

  

            function closeModal() { document.getElementById('modal').style.display = 'none'; } 

        </script>

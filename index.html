    <head> 

        <meta charset="UTF-8"> 

        <title>Gambling AI Portal</title> 

        <style> 

            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap'); 

            body { background: #020617; color: white; font-family: 'Poppins', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; } 

             

            /* BAL OLDAL: STATISZTIKA */ 

            .sidebar { width: 45%; border-right: 1px solid #1e293b; padding: 20px; overflow-y: auto; background: #020617; } 

            .league-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; } 

            .l-btn { background: #0f172a; border: 1px solid #1e293b; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; color: #94a3b8; transition: 0.3s; } 

            .l-btn.active { border-color: #38bdf8; color: white; background: #1e293b; } 

            .match-card { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; } 

            .match-card:hover { border-color: #38bdf8; } 

  

            /* JOBB OLDAL: SZIMULÁTOR */ 

            .main-sim { width: 55%; padding: 20px; background: #0b0f1a; display: flex; flex-direction: column; align-items: center; justify-content: center; } 

            .pitch { width: 90%; height: 280px; background: #15803d; border: 3px solid white; position: relative; border-radius: 15px; margin: 20px 0; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); } 

            .pitch::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white; } 

             

            .scoreboard { font-family: 'Orbitron'; font-size: 3rem; display: flex; gap: 30px; align-items: center; margin-bottom: 10px; } 

            .team-label { font-size: 0.8rem; text-transform: uppercase; color: #38bdf8; font-family: 'Orbitron'; } 

            .timer { font-family: 'Orbitron'; color: #fbbf24; font-size: 1.5rem; margin-bottom: 15px; } 

  

            .event-icon { position: absolute; font-size: 24px; animation: pop 0.4s ease-out; z-index: 5; } 

            @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1.2); } } 

  

            .controls { background: #0f172a; padding: 15px; border-radius: 12px; width: 80%; border: 1px solid #1e293b; } 

            select { background: #1e293b; color: white; border: 1px solid #334155; padding: 8px; border-radius: 5px; width: 45%; } 

            .btn-start { background: #38bdf8; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-family: 'Orbitron'; margin-top: 15px; } 

             

            .log-box { width: 80%; height: 120px; background: #020617; border-radius: 8px; padding: 10px; font-size: 0.8rem; overflow-y: auto; margin-top: 15px; border: 1px solid #1e293b; } 

            .log-msg { border-bottom: 1px solid #0f172a; padding: 4px 0; color: #94a3b8; } 

  

            @media (max-width: 900px) { body { flex-direction: column; overflow-y: auto; height: auto; } .sidebar, .main-sim { width: 100%; height: auto; } } 

        </style>

            // UI Feltöltése 

            const hSel = document.getElementById('hSel'); 

            const vSel = document.getElementById('vSel'); 

            Object.keys(teamData).sort().forEach(t => { 

                hSel.add(new Option(t, t)); 

                vSel.add(new Option(t, t)); 

            }); 

  

            const btnContainer = document.getElementById('leagueBtns'); 

            for(let id in leagueData) { 

                let b = document.createElement('div'); 

                b.className = 'l-btn'; 

                b.innerText = leagueData[id].info.flag + " " + leagueData[id].info.name; 

                b.onclick = () => showLeague(id, b); 

                btnContainer.appendChild(b); 

            } 

  

            function showLeague(id, btn) { 

                document.querySelectorAll('.l-btn').forEach(x => x.classList.remove('active')); 

                btn.classList.add('active'); 

                const list = document.getElementById('matchList'); 

                list.innerHTML = ''; 

                leagueData[id].matches.forEach(m => { 

                    let d = document.createElement('div'); 

                    d.className = 'match-card'; 

                    d.onclick = () => { 

                        hSel.value = m.home; 

                        vSel.value = m.away; 

                        startSim(); 

                    }; 

                    d.innerHTML = `<div style="font-size:0.7rem; color:#38bdf8">${m.date}</div><b>${m.home} - ${m.away}</b>`; 

                    list.appendChild(d); 

                }); 

            } 

  

            let simInterval; 

            function startSim() { 

                clearInterval(simInterval); 

                const hName = hSel.value; 

                const vName = vSel.value; 

                document.getElementById('hNameLabel').innerText = hName; 

                document.getElementById('vNameLabel').innerText = vName; 

                document.getElementById('hScore').innerText = '0'; 

                document.getElementById('vScore').innerText = '0'; 

                document.getElementById('log').innerHTML = ''; 

                document.querySelectorAll('.event-icon').forEach(e => e.remove()); 

                 

                let min = 0, hS = 0, vS = 0; 

                const hChance = (teamData[hName].att + teamData[vName].dfn) / 180; 

                const vChance = (teamData[vName].att + teamData[hName].dfn) / 180; 

  

                simInterval = setInterval(() => { 

                    min++; 

                    document.getElementById('timer').innerText = min.toString().padStart(2, '0') + "'"; 

                     

                    if(Math.random() < hChance) { 

                        hS++; document.getElementById('hScore').innerText = hS; 

                        showEvent('⚽', 'left', `${min}' - GÓL! ${hName}`); 

                    } 

                    if(Math.random() < vChance) { 

                        vS++; document.getElementById('vScore').innerText = vS; 

                        showEvent('⚽', 'right', `${min}' - GÓL! ${vName}`); 

                    } 

                    if(Math.random() < 0.015) { // Lap esély 

                        let type = Math.random() > 0.9 ? '🟥' : '🟨'; 

                        let side = Math.random() > 0.5 ? 'left' : 'right'; 

                        showEvent(type, side, `${min}' - ${type} ${side === 'left' ? hName : vName}`); 

                    } 

  

                    if(min >= 90) clearInterval(simInterval); 

                }, 100); 

            } 

  

            function showEvent(emoji, side, msg) { 

                const icon = document.createElement('div'); 

                icon.className = 'event-icon'; 

                icon.innerText = emoji; 

                icon.style.top = Math.random() * 70 + 15 + '%'; 

                icon.style.left = side === 'left' ? (Math.random() * 35 + 5 + '%') : (Math.random() * 35 + 55 + '%'); 

                document.getElementById('pitch').appendChild(icon); 

                 

                const log = document.getElementById('log'); 

                log.innerHTML = `<div class="log-msg">${msg}</div>` + log.innerHTML; 

            } 

        </script>

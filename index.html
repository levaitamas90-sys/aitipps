
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Gambling AI - Professional Analytics</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
            body { background: #020617; color: white; font-family: 'Poppins', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
            
            /* LISTA */
            .sidebar { width: 300px; border-right: 1px solid #1e293b; padding: 20px; overflow-y: auto; }
            .l-btn { background: #0f172a; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; color: #94a3b8; margin: 2px; display: inline-block; transition: 0.2s; }
            .l-btn.active { border-color: #38bdf8; color: white; }
            .match-card { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem; }
            .match-card:hover { border-color: #38bdf8; }

            /* ELEMZÉS */
            .main-content { flex: 1; padding: 30px; overflow-y: auto; background: #0b0f1a; }
            .analysis-header { border-bottom: 1px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
            .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
            .stat-box { background: #0f172a; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #1e293b; }
            .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
            .stat-val { font-family: 'Orbitron'; font-size: 1.4rem; display: block; margin-top: 5px; }

            /* MINI SZIMULÁTOR (10-15%) */
            .mini-sim-box { 
                width: 320px; background: #0f172a; border-radius: 12px; border: 1px solid #334155; 
                padding: 15px; position: fixed; bottom: 20px; right: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                display: none;
            }
            .pitch-mini { width: 100%; height: 120px; background: #15803d; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; position: relative; margin-top: 10px; overflow: hidden; }
            .pitch-mini::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.3); }
            .scoreboard-mini { display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; font-size: 1.2rem; }
            .timer-mini { font-size: 0.8rem; color: #fbbf24; text-align: center; }
            .btn-mini { background: #38bdf8; border: none; width: 100%; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Orbitron'; font-size: 0.7rem; }
            
            .event-dot { position: absolute; font-size: 14px; z-index: 5; }
            .top-scores { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
            .score-tag { background: #020617; border: 1px solid #38bdf8; padding: 5px 12px; border-radius: 6px; font-family: 'Orbitron'; color: #38bdf8; font-size: 0.9rem; }
        </style>
    </head>
    <body>
        <div class="sidebar">
            <h3 style="font-family:'Orbitron'; color:#38bdf8; font-size:0.9rem">FOOTBALL AI ANALYTICS</h3>
            <div id="leagueBtns"></div>
            <div id="matchList" style="margin-top:20px"></div>
        </div>

        <div class="main-content" id="mainView">
            <div id="emptyState" style="text-align:center; margin-top:100px; color:#64748b">
                <h3>Válassz mérkőzést az elemzéshez</h3>
                <p>Az AI generálja a legfrissebb esélyeket és statisztikákat.</p>
            </div>

            <div id="analysisContent" style="display:none">
                <div class="analysis-header">
                    <span id="anDate" style="color:#38bdf8; font-size:0.8rem; font-family:'Orbitron'"></span>
                    <h1 id="anTeams" style="margin:5px 0; font-size:2rem"></h1>
                    <p id="anNarrative" style="color:#94a3b8; font-size:1rem; font-style:italic"></p>
                </div>

                <div class="stat-grid">
                    <div class="stat-box"><span class="stat-label">AI várható gól (xG)</span><span id="anXG" class="stat-val" style="color:#fbbf24"></span></div>
                    <div class="stat-box"><span class="stat-label">Hazai / D / Vendég</span><span id="an1X2" class="stat-val"></span></div>
                    <div class="stat-box"><span class="stat-label">Gól esély (2.5+)</span><span id="anO25" class="stat-val" style="color:#f472b6"></span></div>
                    <div class="stat-box"><span class="stat-label">BTTS Valószínűség</span><span id="anBTTS" class="stat-val" style="color:#4ade80"></span></div>
                </div>

                <div style="background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #1e293b">
                    <h4 style="margin-top:0; font-family:'Orbitron'; font-size:0.8rem; color:#94a3b8">LEGVALÓSZÍNŰBB EREDMÉNYEK</h4>
                    <div id="anTop3" class="top-scores"></div>
                </div>
            </div>
        </div>

        <div class="mini-sim-box" id="miniSim">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                <span style="font-size:0.6rem; font-family:'Orbitron'; color:#38bdf8">LIVE SIMULATION</span>
                <div class="timer-mini" id="timer">00'</div>
            </div>
            <div class="scoreboard-mini">
                <span id="hScore">0</span>
                <span style="font-size:0.7rem; color:#334155">VS</span>
                <span id="vScore">0</span>
            </div>
            <div class="pitch-mini" id="pitch"></div>
            <button class="btn-mini" onclick="runSim()">MECCS SZIMULÁLÁSA</button>
        </div>

        <script>
            const teams = {};
            const leagues = {};
            
            const btnBox = document.getElementById('leagueBtns');
            for(let id in leagues) {
                let b = document.createElement('div');
                b.className = 'l-btn';
                b.innerText = leagues[id].info.flag + " " + id;
                b.onclick = () => showLeague(id, b);
                btnBox.appendChild(b);
            }

            function showLeague(id, btn) {
                document.querySelectorAll('.l-btn').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                const list = document.getElementById('matchList');
                list.innerHTML = '';
                leagues[id].matches.forEach(m => {
                    let d = document.createElement('div');
                    d.className = 'match-card';
                    d.innerHTML = `<div style="font-size:0.7rem; color:#38bdf8">${m.date}</div><b>${m.home} - ${m.away}</b>`;
                    d.onclick = () => loadAnalysis(m.home, m.away, m.date);
                    list.appendChild(d);
                });
            }

            let cur = null;
            function loadAnalysis(h, v, date) {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('analysisContent').style.display = 'block';
                document.getElementById('miniSim').style.display = 'block';
                
                const tH = teams[h], tV = teams[v];
                const xH = (tH.att * 1.15 + tV.dfn * 0.9) / 2;
                const xV = (tV.att * 0.85 + tH.dfn * 1.1) / 2;
                const totalXG = (xH + xV).toFixed(2);
                
                document.getElementById('anTeams').innerText = `${h} - ${v}`;
                document.getElementById('anDate').innerText = date;
                document.getElementById('anXG').innerText = totalXG;
                document.getElementById('an1X2').innerText = `${Math.round(xH/(xH+xV)*80)}% - 20% - ${Math.round(xV/(xH+xV)*80)}%`;
                document.getElementById('anO25').innerText = totalXG > 2.5 ? "64%" : "38%";
                document.getElementById('anBTTS').innerText = totalXG > 2.2 ? "59%" : "41%";
                document.getElementById('anNarrative').innerText = totalXG > 3 ? "Magas intenzitású mérkőzés, ahol a támadók akarata érvényesülhet." : "Várhatóan taktikus, fegyelmezett védekezésre épülő találkozó.";
                
                const top3 = document.getElementById('anTop3');
                top3.innerHTML = `<div class="score-tag">1-1</div><div class="score-tag">2-1</div><div class="score-tag">1-0</div>`;
                
                cur = {h, v, xH, xV};
                resetSim();
            }

            let simInt;
            function resetSim() {
                clearInterval(simInt);
                document.getElementById('hScore').innerText = '0';
                document.getElementById('vScore').innerText = '0';
                document.getElementById('timer').innerText = "00'";
                document.getElementById('pitch').innerHTML = '';
            }

            function runSim() {
                resetSim();
                let min = 0, hS = 0, vS = 0;
                simInt = setInterval(() => {
                    min++;
                    document.getElementById('timer').innerText = min.toString().padStart(2, '0') + "'";
                    if(Math.random() < cur.xH/90) { hS++; document.getElementById('hScore').innerText = hS; spawn('⚽', '5%'); }
                    if(Math.random() < cur.xV/90) { vS++; document.getElementById('vScore').innerText = vS; spawn('⚽', '60%'); }
                    if(min >= 90) clearInterval(simInt);
                }, 60);
            }

            function spawn(emoji, left) {
                const d = document.createElement('div');
                d.className = 'event-dot';
                d.innerText = emoji;
                d.style.left = (parseFloat(left) + Math.random()*30) + '%';
                d.style.top = Math.random()*70 + 10 + '%';
                document.getElementById('pitch').appendChild(d);
            }
        </script>
    </body>
    </html>

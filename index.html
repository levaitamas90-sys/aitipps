        .league-acc { background: #1e293b; border: 1px solid #334155; margin-bottom: 12px; border-radius: 12px; transition: 0.3s; overflow: hidden; }
        .league-acc:hover { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }

    <script>
        var acc = document.getElementsByClassName("league-btn");
        for (var i = 0; i < acc.length; i++) {
            acc[i].onclick = function() {
                this.classList.toggle("active");
                var content = this.nextElementSibling;
                if (content.style.display === "block") {
                    content.style.display = "none";
                } else {
                    content.style.display = "block";
                }
            }
        }
    </script>

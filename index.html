<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Futball Tipp Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; }
        h1 { text-align: center; color: #1a237e; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; overflow: hidden; }
        .league-header { background: #1a237e; color: white; padding: 15px 20px; font-size: 1.2em; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: center; border-bottom: 2px solid #dee2e6; font-size: 0.85em; color: #666; }
        td { padding: 14px 12px; border-bottom: 1px solid #eee; text-align: center; }
        .match-cell { text-align: left; font-weight: bold; width: 30%; color: #2c3e50; }
        .prob { font-weight: bold; color: #1a237e; }
        .goal { font-weight: bold; color: #d84315; }
        tr:hover { background: #f9f9f9; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.85em; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ LT ai tipps KK mit ad hozzá?</h1>

        </table></div>
        <div class="footer">
            <p>Adatok frissítve: 2026-04-29 09:09</p>
            <p>A tippek matematikai valószínűségen alapulnak.</p>
        </div>
    </div>
</body>
</html>

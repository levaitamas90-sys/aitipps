            // Select-ek feltöltése 

            const hSel = document.getElementById('homeSel'); 

            const vSel = document.getElementById('awaySel'); 

            const sortedTeams = Object.keys(teamStats).sort(); 

             

            sortedTeams.forEach(t => { 

                let opt1 = new Option(`${teamStats[t].flag} ${t}`, t); 

                let opt2 = new Option(`${teamStats[t].flag} ${t}`, t); 

                hSel.add(opt1); 

                vSel.add(opt2); 

            }); 

  

            // Liga gombok 

            const nav = document.getElementById('leagueNav'); 

            for(let id in leagues) { 

                let b = document.createElement('div'); 

                b.className = 'l-btn'; 

                b.innerHTML = `${leagues[id].info.flag} ${leagues[id].info.name}`; 

                b.onclick = () => showLeague(id, b); 

                nav.appendChild(b); 

            } 

  

            function showLeague(id, btn) { 

                document.querySelectorAll('.l-btn').forEach(x => x.classList.remove('active')); 

                btn.classList.add('active'); 

                const list = document.getElementById('matchList'); 

                list.innerHTML = ''; 

                leagues[id].matches.forEach(m => { 

                    let d = document.createElement('div'); 

                    d.className = 'match-row'; 

                    d.onclick = () => { 

                        document.getElementById('homeSel').value = m.home; 

                        document.getElementById('awaySel').value = m.away; 

                        runCustomSim(); 

                        window.scrollTo({top: 0, behavior: 'smooth'}); 

                    }; 

                    d.innerHTML = `<span>${m.home} - ${m.away}</span><span style="color:#38bdf8; font-size:0.8em">${m.date}</span>`; 

                    list.appendChild(d); 

                }); 

            } 

  

            function poisson(lambda) { 

                let L = Math.exp(-lambda), k = 0, p = 1; 

                do { k++; p *= Math.random(); } while (p > L); 

                return k - 1; 

            } 

  

            function runCustomSim() { 

                const hName = document.getElementById('homeSel').value; 

                const vName = document.getElementById('awaySel').value; 

                const h = teamStats[hName]; 

                const v = teamStats[vName]; 

  

                let hWins = 0, draws = 0, vWins = 0, totalGoals = 0; 

                let results = []; 

  

                // 20.000 szimuláció helyben! 

                const expH = ((h.att * 1.15) + (v.dfn * 1.1)) / 2; 

                const expV = ((v.att * 0.85) + (h.dfn * 0.9)) / 2; 

  

                for(let i=0; i<20000; i++) { 

                    let gH = poisson(expH); 

                    let gV = poisson(expV); 

                    if(gH > gV) hWins++; 

                    else if(gH === gV) draws++; 

                    else vWins++; 

                    totalGoals += (gH + gV); 

                    results.push(`${gH}-${gV}`); 

                } 

  

                // Eredmények megjelenítése 

                document.getElementById('resultPanel').style.display = 'block'; 

                document.getElementById('resTitle').innerText = `${hName} vs ${vName}`; 

                document.getElementById('resXG').innerText = (totalGoals / 20000).toFixed(2); 

                document.getElementById('resH').innerText = (hWins/200).toFixed(0) + '%'; 

                document.getElementById('resD').innerText = (draws/200).toFixed(0) + '%'; 

                document.getElementById('resV').innerText = (vWins/200).toFixed(0) + '%'; 

  

                // Top 3 score 

                let counts = {}; 

                results.forEach(r => counts[r] = (counts[r] || 0) + 1); 

                let top = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,3); 

                 

                const scoreDiv = document.getElementById('resScores'); 

                scoreDiv.innerHTML = ''; 

                top.forEach(s => { 

                    scoreDiv.innerHTML += `<div style="background:#1e293b; padding:8px 15px; border-radius:5px; border:1px solid #38bdf8; font-family:Orbitron"><b>${s[0]}</b></div>`; 

                }); 

            } 

        </script>

            .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white; } 

            .center-circle {

            /* ESEMÉNYEK */

            /* UI */

            .btn-play { background: #38bdf8; color: #020617; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Orbitron'; } 

             

            .scoreboard { font-family: 'Orbitron'; font-size: 2.5rem; margin: 10px 0; display: flex; justify-content: center; gap: 20px; align-items: center; } 

            .timer { font-size: 1.2rem; color: #fbbf24; margin-bottom: 10px; } 

            .log { background: #0f172a; height: 100px; overflow-y: auto; padding: 10px; font-size: 0.8rem; border-radius: 8px; text-align: left; } 

            .log-item { border-bottom: 1px solid #1e293b; padding: 3px 0; }

            const hSel = document.getElementById('hSel'); 

            const vSel = document.getElementById('vSel'); 

             

            Object.keys(teams).sort().forEach(t => { 

                hSel.add(new Option(t, t)); 

                vSel.add(new Option(t, t)); 

            }); 

  

            let matchInterval; 

  

            function startMatch() { 

                clearInterval(matchInterval); 

                const hName = hSel.value; 

                const vName = vSel.value; 

                const h = teams[hName]; 

                const v = teams[vName]; 

                 

                document.getElementById('pitch').querySelectorAll('.event-icon').forEach(e => e.remove()); 

                document.getElementById('log').innerHTML = ''; 

                document.getElementById('hScore').innerText = '0'; 

                document.getElementById('vScore').innerText = '0'; 

                document.getElementById('startBtn').disabled = true; 

  

                let minute = 0; 

                let hScore = 0; 

                let vScore = 0; 

  

                // Gól esély per perc 

                const hChance = ((h.att + v.dfn) / 2) / 90; 

                const vChance = ((v.att + h.dfn) / 2) / 90; 

  

                matchInterval = setInterval(() => { 

                    minute++; 

                    document.getElementById('time').innerText = minute + "'"; 

  

                    // GÓL LOGIKA 

                    if(Math.random() < hChance) { 

                        hScore++; 

                        addEvent('⚽', 'left', `${minute}' - GÓL! ${hName}`); 

                        document.getElementById('hScore').innerText = hScore; 

                    } 

                    if(Math.random() < vChance) { 

                        vScore++; 

                        addEvent('⚽', 'right', `${minute}' - GÓL! ${vName}`); 

                        document.getElementById('vScore').innerText = vScore; 

                    } 

  

                    // LAP LOGIKA (véletlenszerű 2% esély per perc) 

                    if(Math.random() < 0.02) { 

                        const side = Math.random() > 0.5 ? 'left' : 'right'; 

                        const type = Math.random() > 0.9 ? '🟥' : '🟨'; 

                        const name = side === 'left' ? hName : vName; 

                        addEvent(type, side, `${minute}' - ${type} ${name}`); 

                    } 

  

                    if(minute >= 90) { 

                        clearInterval(matchInterval); 

                        addLog("<b>VÉGE A MÉRKŐZÉSNEK!</b>"); 

                        document.getElementById('startBtn').disabled = false; 

                    } 

                }, 150); // 150ms = 1 meccs perc (kb 13 mp a meccs) 

            } 

  

            function addEvent(emoji, side, text) { 

                const pitch = document.getElementById('pitch'); 

                const icon = document.createElement('div'); 

                icon.className = 'event-icon'; 

                icon.innerText = emoji; 

                icon.style.top = Math.random() * 80 + 10 + '%'; 

                icon.style.left = side === 'left' ? (Math.random() * 40 + 5 + '%') : (Math.random() * 40 + 55 + '%'); 

                pitch.appendChild(icon); 

                addLog(text); 

            } 

  

            function addLog(text) { 

                const log = document.getElementById('log'); 

                log.innerHTML = `<div class="log-item">${text}</div>` + log.innerHTML; 

            }
